name: Build PostLock App

on:
  workflow_dispatch:
  push:
    paths:
      - "postlock-app/**"
      - ".github/workflows/build-postlock-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: postlock-app
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: postlock-app-debug
          path: postlock-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
